<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sentinel SIEM</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="login-box">

        <h1>Sentinel SIEM</h1>

        <p>Security Information & Event Management</p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button
            onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="api.js"></script>

<script src="login.js"></script>

</body>

</html>
