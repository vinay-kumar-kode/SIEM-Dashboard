<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sentinel SIEM - Logs</title>

    <link rel="stylesheet" href="layout.css">

    <link rel="stylesheet" href="components.css">

    <link rel="stylesheet" href="logs.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-shield-halved"></i>

            <h2>Sentinel SIEM</h2>

        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="logs.html">
                    <i class="fa-solid fa-file-lines"></i>
                    Logs
                </a>
            </li>

            <li>
                <a href="alerts.html">
                    <i class="fa-solid fa-bell"></i>
                    Alerts
                </a>
            </li>

            <li>
                <a href="incidents.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Incidents
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reports
                </a>
            </li>

            <li data-admin-only>
                <a href="users.html">
                    <i class="fa-solid fa-users"></i>
                    Users
                </a>
            </li>

            <li data-admin-only>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

            <li>
                <a href="#" onclick="logout(); return false;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <main class="main">

        <header class="header">

            <div>
                <h1>Security Logs</h1>
                <p>Raw events collected from every monitored source</p>
            </div>

            <div id="clock"></div>

        </header>

        <!-- Summary -->

        <section class="summary">

            <div class="summary-card">
                <h3>Total Logs</h3>
                <h2 id="logCount">0</h2>
            </div>

            <div class="summary-card critical">
                <h3>Critical</h3>
                <h2 id="criticalCount">0</h2>
            </div>

            <div class="summary-card high">
                <h3>High</h3>
                <h2 id="highCount">0</h2>
            </div>

            <div class="summary-card medium">
                <h3>Medium</h3>
                <h2 id="mediumCount">0</h2>
            </div>

            <div class="summary-card low">
                <h3>Low</h3>
                <h2 id="lowCount">0</h2>
            </div>

        </section>

        <!-- Controls -->

        <section class="controls">

            <input
                type="text"
                id="searchBox"
                placeholder="Search IP, event or message...">

            <select id="severityFilter">
                <option value="ALL">All Severity</option>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <select id="sourceFilter">
                <option value="ALL">All Sources</option>
            </select>

            <select id="statusFilter">
                <option value="ALL">All Status</option>
                <option value="New">New</option>
                <option value="Monitoring">Monitoring</option>
                <option value="Closed">Closed</option>
            </select>

            <select id="limitSelect">
                <option value="25">25 / page</option>
                <option value="50">50 / page</option>
                <option value="100">100 / page</option>
            </select>

            <label class="live-toggle">
                <input type="checkbox" id="liveToggle">
                Live
            </label>

            <button class="btn btn-ghost" id="refreshBtn">
                <i class="fa-solid fa-rotate"></i>
                Refresh
            </button>

            <button class="btn" id="exportBtn">
                <i class="fa-solid fa-download"></i>
                Export CSV
            </button>

        </section>

        <!-- Logs Table -->

        <section class="table-section">

            <div class="table-scroll">

                <table>

                    <thead>

                        <tr>

                            <th>Time</th>
                            <th>Source IP</th>
                            <th>Source</th>
                            <th>Severity</th>
                            <th>Event</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="logsTable">

                        <tr>
                            <td colspan="6" class="empty-state">Loading logs...</td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="pagination" id="logsPagination"></div>

        </section>

    </main>

</div>

<script src="api.js"></script>

<script src="logs.js"></script>

</body>

</html>
